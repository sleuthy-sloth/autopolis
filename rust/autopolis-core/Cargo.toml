[package]
name = "autopolis-core"
version = "0.1.0"
edition = "2021"
description = "Faithful Rust port of the Autopolis TypeScript simulation core (deterministic, dependency-free)"

[lib]
name = "autopolis_core"
path = "src/lib.rs"

[[bin]]
name = "autopolis-sim"
path = "src/bin/autopolis-sim.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
